[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drvi"
version = "0.1.0"
description = "DrVI: Disentangled Multi-resolution Variational Inference for Perturbation Analysis"
dependencies = [
    "torch>=2.0",
    "scvi-tools>=1.0",
    "scanpy",
    "numpy",
    "pandas"
]